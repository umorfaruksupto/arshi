<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05080d"><title>ArshiOS 🌙</title>
<!-- HOW TO USE: keep pic1.png, pic2.png and pic3.png beside this file, then deploy the folder. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@500;700;900&family=Hind+Siliguri:wght@300;400;500;600;700&family=Great+Vibes&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05080d;--ivory:#f5ead7;--muted:#9fb2bc;--gold-b:#ffd98a;--champ:#c89b4f;--teal:#7fd6c8;--rose:#f2a2b0;--line:rgba(255,255,255,.14);--glass:rgba(18,24,34,.62);--serif:'Noto Serif Bengali',serif;--body:'Hind Siliguri',sans-serif;--script:'Great Vibes',cursive;--sys:'Inter',-apple-system,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ivory);font-family:var(--body);user-select:none}
button{font-family:inherit;cursor:pointer}
#wall{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 18% 12%,rgba(113,76,185,.72),transparent 42%),radial-gradient(ellipse at 82% 18%,rgba(23,145,177,.58),transparent 38%),radial-gradient(ellipse at 50% 100%,rgba(198,82,134,.5),transparent 46%),linear-gradient(135deg,#11142e 0%,#101d3d 46%,#26152f 100%)}
.aw{position:absolute;inset:-8%;background:radial-gradient(ellipse at 25% 20%,rgba(255,255,255,.15),transparent 25%),radial-gradient(ellipse at 75% 70%,rgba(255,185,218,.12),transparent 30%);opacity:.7;transition:opacity 1.2s;filter:blur(34px) saturate(1.2);animation:wallDrift 22s ease-in-out infinite alternate}.aw.on{opacity:.82}
@keyframes wallDrift{to{transform:scale(1.08) translate(2%, -1%)}}
.au{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.a1{width:60vmax;height:60vmax;top:-25vmax;left:-18vmax;background:radial-gradient(circle,#123a41,transparent 65%);animation:d1 26s ease-in-out infinite alternate}
.a2{width:50vmax;height:50vmax;bottom:-22vmax;right:-15vmax;background:radial-gradient(circle,#3a2a17,transparent 65%);animation:d1 30s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate(6vmax,4vmax) scale(1.12)}}
#stars{position:absolute;inset:0}
/* boot */
#boot{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.3rem;transition:opacity .7s}
body.booted #boot{opacity:0;pointer-events:none}
.blogo{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff,#a0c4ff 60%,#5a8dff);box-shadow:0 0 60px rgba(160,196,255,.45);animation:bp 2s infinite}
@keyframes bp{50%{transform:scale(1.07)}}
.bname{font:600 .85rem var(--sys);letter-spacing:.3em;color:#9ab}
.bbar{width:170px;height:3px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}.bbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5a8dff,#a0c4ff);animation:bl 2.4s forwards}
@keyframes bl{to{width:100%}}
.blog{font:.62rem ui-monospace,monospace;color:#5a7488;text-align:center;line-height:1.9;min-height:4.6em}
/* lock */
#lock{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;background:rgba(3,6,10,.4);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);opacity:0;pointer-events:none;transition:opacity .6s,transform .5s cubic-bezier(.2,.8,.2,1);touch-action:none}
body.booted #lock{opacity:1;pointer-events:auto}
body.unlocked #lock{opacity:0;pointer-events:none;transform:translateY(-100%)}
.lstat{width:100%;display:flex;justify-content:space-between;padding:calc(14px + var(--sat)) 20px 0;font:600 .78rem var(--sys);color:#fff}
.lclock{margin-top:9vh;font:300 clamp(4rem,16vw,7.5rem)/1 var(--sys);letter-spacing:-.04em;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.5)}
.ldate{font:500 clamp(.95rem,3vw,1.25rem) var(--sys);color:rgba(255,255,255,.85);margin-top:.4rem}
.notif{margin-top:5vh;width:min(380px,88vw);background:rgba(255,255,255,.13);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:18px;padding:.9rem 1rem;display:flex;gap:.8rem;align-items:center;cursor:pointer;animation:nf 3s ease-in-out infinite}
@keyframes nf{50%{transform:translateY(-5px)}}
.nic{width:40px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:1.2rem;background:linear-gradient(135deg,var(--gold-b),var(--champ))}
.notif b{font:600 .8rem var(--sys);display:block}.notif p{font-size:.78rem;color:rgba(255,255,255,.75)}
.lhint{position:absolute;bottom:calc(60px + var(--sab));font:.8rem var(--sys);color:rgba(255,255,255,.6);animation:hf 2.2s ease-in-out infinite;text-align:center}
.lhint::before{content:'';display:block;width:120px;height:5px;border-radius:5px;background:rgba(255,255,255,.7);margin:0 auto 12px}
@keyframes hf{50%{transform:translateY(-7px)}}
.sb{display:flex;align-items:center;gap:7px}
.batt{display:flex;align-items:center;gap:4px;font:600 .7rem var(--sys)}
.batt .sh{width:22px;height:11px;border:1.4px solid rgba(255,255,255,.7);border-radius:3px;padding:1.5px}.batt .lv{display:block;height:100%;width:80%;background:#fff;border-radius:1.5px}
/* shell */
#shell{position:fixed;inset:0;z-index:10;opacity:0;pointer-events:none;transition:opacity .7s}body.unlocked #shell{opacity:1;pointer-events:auto}
#mbar{display:none;height:30px;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(8,12,18,.55);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);font:.75rem var(--sys);color:rgba(255,255,255,.88);position:relative;z-index:900}
body.desktop #mbar{display:flex}#mbar .l,#mbar .r{display:flex;align-items:center;gap:1.1rem}
#mbar .logo{font-weight:700;cursor:pointer}#mbar .mi{opacity:.85;cursor:pointer}#appName{font-weight:600}
.pop{position:absolute;top:33px;background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:12px;padding:.5rem;font:.76rem var(--sys);display:none;box-shadow:0 14px 40px rgba(0,0,0,.5);min-width:190px;z-index:950}.pop.on{display:block}
.pop div{padding:.45rem .7rem;border-radius:7px;cursor:pointer}.pop div:hover{background:var(--gold-b);color:#241309}.pop hr{border:none;border-top:1px solid var(--line);margin:.3rem 0}
#sbar{display:none;justify-content:space-between;align-items:center;padding:calc(10px + var(--sat)) 18px 0;font:600 .76rem var(--sys);color:rgba(255,255,255,.94);text-shadow:0 1px 8px rgba(0,0,0,.3)}#sbar .sb{gap:9px}#sbar .signal{font-size:.68rem;letter-spacing:-.14em;opacity:.9}body.phone #sbar{display:flex}
#home{display:none;position:absolute;inset:0;padding:calc(60px + var(--sat)) 22px 120px;flex-direction:column}body.phone #home{display:flex}
.widget{background:rgba(255,255,255,.1);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;padding:1rem 1.2rem;margin-bottom:1.6rem}
.widget .wd{font:.7rem var(--sys);letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}.widget .wt{font:700 1.15rem var(--serif);margin-top:.2rem}.widget .wc{font:300 2.4rem var(--sys);margin-top:.3rem}
#hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4rem .6rem}
.hicon,.dicon{display:flex;flex-direction:column;align-items:center;gap:.4rem;cursor:pointer}
.hicon{animation:hin .6s backwards}.hicon:active .aic{transform:scale(.86)}@keyframes hin{from{opacity:0;transform:translateY(16px) scale(.8)}}
.hicon span,.dicon span{font:.68rem var(--sys);color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.aic{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;font-size:1.7rem;box-shadow:0 8px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s}
.c-photos{background:linear-gradient(135deg,#ff9ec3,#ff5f8f)}.c-notes{background:linear-gradient(135deg,#ffe08a,#e8a33d)}.c-music{background:linear-gradient(135deg,#ff8f7a,#e84d5b)}.c-term{background:linear-gradient(135deg,#3a4656,#11161d)}.c-set{background:linear-gradient(135deg,#b9c3cf,#6b7785)}
.c-surprise{background:linear-gradient(135deg,#8ff0e2,#2ab5aa);animation:pg 2.2s infinite}@keyframes pg{0%{box-shadow:0 0 0 0 rgba(127,214,200,.55)}100%{box-shadow:0 0 0 12px rgba(127,214,200,0)}}
#dicons{display:none;position:absolute;top:46px;left:14px;flex-direction:column;gap:4px;z-index:12;flex-wrap:wrap;height:calc(100% - 140px)}body.desktop #dicons{display:flex}
.dicon{width:88px;padding:.6rem 0;border-radius:10px}.dicon:hover{background:rgba(255,255,255,.1)}.dicon .aic{width:52px;height:52px;font-size:1.5rem}
#dock{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:10px;padding:8px 10px;background:rgba(255,255,255,.1);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.16);border-radius:22px;z-index:24}
body.phone #dock{bottom:calc(26px + var(--sab))}body.desktop #dock{bottom:12px}
.dk{position:relative;cursor:pointer;transition:transform .15s}.dk .aic{width:48px;height:48px;font-size:1.45rem}.dk:active{transform:scale(.88)}
.dk.run::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#fff}
.dk .tip{position:absolute;bottom:62px;left:50%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);padding:.2rem .6rem;border-radius:7px;font:.7rem var(--sys);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}.dk:hover .tip{opacity:1}
body.phone .dk .tip{display:none}
#hind{display:none;position:fixed;bottom:calc(8px + var(--sab));left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:5px;background:rgba(255,255,255,.85);z-index:60}body.phone.unlocked #hind{display:block}
/* windows */
.win{position:fixed;display:none;flex-direction:column;background:rgba(10,15,24,.93);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--line);box-shadow:0 40px 100px rgba(0,0,0,.6);z-index:30}.win.open{display:flex}
.win.closing{opacity:0;transform:scale(.92)!important;transition:.25s}
body.desktop .win{left:var(--x);top:var(--y);width:var(--w);height:var(--h);border-radius:12px;overflow:hidden;min-width:300px;min-height:200px}
body.desktop .win.open{animation:wo .3s cubic-bezier(.2,.8,.2,1)}@keyframes wo{from{opacity:0;transform:scale(.92)}}
body.desktop .win.max{left:0!important;top:30px!important;width:100vw!important;height:calc(100% - 30px)!important;border-radius:0}
body.desktop .win.min{display:none}
body.phone .win{inset:0;border:none;z-index:40}body.phone .win.open{animation:ao .4s cubic-bezier(.2,.9,.25,1)}@keyframes ao{from{transform:translateY(10%) scale(.96);opacity:.4}}
.tbar{display:none;height:38px;align-items:center;padding:0 12px;gap:8px;background:rgba(0,0,0,.35);flex:none}body.desktop .tbar{display:flex}
.tl{width:12px;height:12px;border-radius:50%;display:grid;place-items:center;font-size:8px;color:transparent;font-weight:700}.win:hover .tl{color:rgba(0,0,0,.6)}.tl.r{background:#ff5f57}.tl.y{background:#febc2e}.tl.g{background:#28c840}
.ttl{flex:1;text-align:center;font:.74rem var(--sys);color:rgba(255,255,255,.6);margin-right:44px}
.abar{display:none;align-items:center;gap:.8rem;padding:calc(12px + var(--sat)) 16px 10px;background:rgba(0,0,0,.3);flex:none;font-family:var(--sys)}body.phone .abar{display:flex}
.aback{width:30px;height:30px;border-radius:9px;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:1.1rem}
.wbody{flex:1;overflow-y:auto;overscroll-behavior:contain;position:relative;user-select:text}
.wbody::-webkit-scrollbar{width:8px}.wbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
.rz{display:none;position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:5}body.desktop .rz{display:block}
/* apps */
.ph-h{padding:1.5rem 1.5rem .3rem;font-family:var(--sys)}.ph-h h2{font-size:1.5rem}.ph-h p{color:var(--muted);font-size:.8rem}
#phGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px;padding:1rem 1.5rem 3rem}#phGrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;transition:.2s}#phGrid img:hover{transform:scale(1.03)}
.empty{padding:3rem 2rem;text-align:center;color:var(--muted)}
.paper{margin:1.2rem;background:linear-gradient(175deg,#f9f1e0,#efe3c9);color:#4a3a28;border-radius:10px;padding:1.6rem;line-height:2;box-shadow:0 20px 50px rgba(0,0,0,.4);min-height:240px;outline:none}.paper h3{font:700 1.2rem var(--serif);color:#8a6420}
.nhint{margin:0 1.2rem;font:.72rem var(--sys);color:var(--muted)}
.mus{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;height:100%;padding:2rem;text-align:center}
.disc{width:170px;height:170px;border-radius:50%;background:conic-gradient(#1a2430,#2c3a4a,#1a2430,#2c3a4a,#1a2430);display:grid;place-items:center;box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 0 0 6px #0b1220;animation:sp 6s linear infinite paused}.mus.on .disc{animation-play-state:running}@keyframes sp{to{transform:rotate(360deg)}}
.disc i{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold-b),var(--champ));display:grid;place-items:center;font-size:1.6rem;font-style:normal}
.mus h3{font:600 1.05rem var(--sys)}.mus p{color:var(--muted);font-size:.8rem}
.mbtn{width:62px;height:62px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--gold-b),var(--champ));font-size:1.4rem;box-shadow:0 12px 30px rgba(200,155,79,.4)}
.vis{display:flex;gap:4px;align-items:flex-end;height:30px}.vis i{width:5px;background:var(--gold-b);border-radius:3px;height:6px}.mus.on .vis i{animation:vb .8s ease-in-out infinite alternate}.vis i:nth-child(2n){animation-delay:.2s!important}.vis i:nth-child(3n){animation-delay:.4s!important}@keyframes vb{to{height:28px}}
#term{height:100%;background:#0a0e14;padding:1rem;font:.8rem/1.7 ui-monospace,Menlo,monospace;color:#b9f5e8;overflow-y:auto;user-select:text}#term .term-status{display:flex;justify-content:space-between;gap:1rem;padding:.65rem .75rem;margin-bottom:.9rem;border:1px solid rgba(127,214,200,.2);border-radius:10px;background:rgba(127,214,200,.06);color:#d8fff7;font-size:.74rem}#term .term-status b{color:var(--gold-b);font-weight:500}
#term .ln{white-space:pre-wrap}#term .in{display:flex;gap:.5rem}#term input{flex:1;background:none;border:none;outline:none;color:#fff;font:inherit;user-select:text}
.set{padding:1.4rem;font-family:var(--sys)}.set h3{font-size:.8rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin:1.2rem 0 .6rem}.set h3:first-child{margin-top:0}
.sw{display:flex;gap:.7rem}.sw b{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid transparent}.sw b.on{border-color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;background:rgba(255,255,255,.06);border-radius:12px;margin-bottom:.5rem;font-size:.88rem}
.tg{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.2);position:relative;cursor:pointer;transition:.2s}.tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--teal)}.tg.on::after{left:21px}
/* spotlight, ctx, toast, lightbox */
#spot{position:fixed;inset:0;z-index:960;background:rgba(0,0,0,.4);display:none;justify-content:center;padding-top:16vh}#spot.on{display:flex}
#spot>div{width:min(560px,92vw);height:fit-content;background:var(--glass);backdrop-filter:blur(30px);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#spot input{width:100%;padding:1.1rem 1.3rem;background:none;border:none;outline:none;color:#fff;font:1.1rem var(--sys);user-select:text}
#spRes div{padding:.7rem 1.3rem;font:.88rem var(--sys);cursor:pointer;display:flex;gap:.7rem}#spRes div.sel,#spRes div:hover{background:var(--gold-b);color:#241309}
#ctx{position:fixed;z-index:970}
#toast{position:fixed;top:calc(14px + var(--sat));left:50%;transform:translate(-50%,-140%);z-index:980;background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:18px;padding:.7rem 1.1rem;font:.82rem var(--sys);display:flex;gap:.7rem;align-items:center;transition:transform .5s cubic-bezier(.2,.9,.3,1.2);max-width:92vw}#toast.on{transform:translate(-50%,0)}
body.desktop #toast{top:42px}
#lb{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;flex-direction:column;gap:1rem}#lb.on{display:flex}#lb img{max-width:92vw;max-height:78vh;border-radius:8px}
#lb .rw{display:flex;gap:1rem;align-items:center;font:.8rem var(--sys);color:#ccc}#lb button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:1.1rem}
#fx{position:fixed;inset:0;z-index:85;pointer-events:none}
/* surprise site */
#prog{position:sticky;top:0;height:2px;width:100%;z-index:5;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--champ),var(--gold-b),var(--rose))}
.site{opacity:0;transition:opacity .9s .2s}.win.launched .site{opacity:1}
.hero{max-width:1100px;margin:auto;padding:clamp(2.2rem,6vh,4.5rem) 1.3rem 2.5rem;display:grid;gap:2.5rem;align-items:center}
.kick{font:italic 500 .9rem var(--sys);letter-spacing:.22em;text-transform:uppercase;color:var(--teal)}
.name{font-family:var(--serif);line-height:1.3;margin:.5rem 0 1rem}.l1{display:block;font-weight:900;font-size:clamp(2.4rem,8vw,4.4rem);background:linear-gradient(90deg,var(--gold-b),var(--champ),var(--rose),var(--gold-b));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 7s linear infinite}
@keyframes sh{to{background-position:300% 0}}.l2{display:block;font-weight:700;font-size:clamp(1.3rem,5vw,2.1rem)}.moon{display:inline-block;animation:fl 3.2s ease-in-out infinite;cursor:pointer}@keyframes fl{50%{transform:translateY(-10px)}}
.typ{min-height:1.7em;color:var(--teal);font-weight:600}.caret{display:inline-block;width:2px;height:1em;background:var(--teal);margin-left:2px;vertical-align:-2px;animation:ck 1s steps(1) infinite}@keyframes ck{50%{opacity:0}}
.hsub{color:var(--muted);max-width:46ch;margin:.7rem 0 1.4rem;line-height:1.9}.hsub b{color:var(--ivory)}
.btn{font-weight:700;font-size:.95rem;padding:.85rem 1.7rem;border:none;border-radius:999px;transition:transform .25s}.btn:active{transform:scale(.95)}.bg{background:linear-gradient(135deg,var(--gold-b),var(--champ));color:#241309;box-shadow:0 12px 30px rgba(200,155,79,.35)}.bh{background:transparent;border:1px solid var(--line);color:var(--ivory)}
.polaroid{background:#f7efe2;color:#3a2b1c;padding:.9rem .9rem 1rem;border-radius:6px;position:relative;transform:rotate(-3deg);box-shadow:0 26px 70px rgba(0,0,0,.55);width:min(300px,78vw);margin:auto}
.pp{aspect-ratio:4/5;border-radius:4px;overflow:hidden;background:linear-gradient(160deg,#12333d,#0a1a21);display:grid;place-items:center;font-size:3rem}.pp img{width:100%;height:100%;object-fit:cover}.polaroid figcaption{font:1.7rem var(--script);text-align:center;padding-top:.7rem}
.wrap{max-width:1050px;margin:auto;padding:3.2rem 1.3rem}.stitle{font-family:var(--serif);font-weight:700;font-size:clamp(1.5rem,5vw,2.4rem);line-height:1.4;margin-bottom:1.5rem}
.grid{display:grid;gap:1.2rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.mc{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:20px;padding:1.6rem;transition:.35s}.mc:hover{transform:translateY(-6px)}.mc .big{font:900 1.8rem var(--serif);color:var(--gold-b)}.mc p{color:var(--muted);margin-top:.6rem;line-height:1.9}.mc b{color:var(--ivory)}
.fc{height:190px;perspective:1100px;cursor:pointer}.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.7,.2,1)}.fc.f .fi{transform:rotateY(180deg)}
.fa{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.5rem;padding:1.3rem}

const SEQ=[523.25,659.25,783.99,880,783.99,659.25,587.33,659.25,523.25,0,587.33,659.25,880,1046.5,880,783.99,659.25,587.33,523.25,0];
function nt(f,t,v,d){[[1,v,d],[2,v*.22,d*.6]].forEach(([m,vv,dd])=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f*m;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vv,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dd);o.connect(g);g.connect(master);o.start(t);o.stop(t+dd+.05)})}
function sched(){while(nxT<AC.currentTime+.7){const f=SEQ[stI%SEQ.length];if(f)nt(f,nxT,.11,1.7);if(stI%8===0)nt(stI%16===0?130.81:98,nxT,.09,2.2);nxT+=.42;stI++}}

const COLS=['#ffd98a','#e8c37e','#c89b4f','#f2a2b0','#7fd6c8','#f5ead7'];let P=[],rn=false;
function burst(x,y,n=120,sp=Math.PI){if(reduced)n=Math.min(n,30);for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*sp,v=6+Math.random()*7;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.18+Math.random()*.08,w:5+Math.random()*6,h:8+Math.random()*8,r:Math.random()*3,vr:(Math.random()-.5)*.3,c:COLS[i%6],l:0,tl:90+Math.random()*40})}if(!rn){rn=true;requestAnimationFrame(fs)}}
function fs(){fc.clearRect(0,0,fx.width,fx.height);P=P.filter(p=>p.l<p.tl&&p.y<fx.height+40);for(const p of P){p.l++;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.99;p.r+=p.vr;fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.globalAlpha=Math.max(1-p.l/p.tl,0);fc.fillStyle=p.c;fc.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.sin(p.l*.1+p.r)));fc.restore()}if(P.length)requestAnimationFrame(fs);else{rn=false;fc.clearRect(0,0,fx.width,fx.height)}}
